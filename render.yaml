services:
  - type: web
    name: b-will
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
