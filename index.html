<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101b42" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>B-Will</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg-top: #1d2f66;
      --bg-bot: #101b42;
      --header-bg: #16255a;
      --border: #2a3f87;
      --btn-bg: #243d88;
      --btn-shadow: #13214d;
      --yellow: #ffc933;
      --yellow-shadow: #b8890a;
      --green: #82e05a;
      --green-shadow: #4a962b;
      --red: #ff4d5a;
      --muted: #9aa9d8;
      --text: #ffffff;
      --card-bg: rgba(22, 37, 90, 0.78);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input {
      user-select: text;
      font-family: "Trebuchet MS", Helvetica, Arial, sans-serif;
      font-weight: 700;
    }

    body {
      font-family: "Trebuchet MS", Helvetica, Arial, sans-serif;
      font-weight: 700;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    .hidden { display: none !important; }

    /* Shared 3D Raised Button */
    .btn3d {
      border: 2px solid var(--border);
      background: var(--btn-bg);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--btn-shadow);
      cursor: pointer;
      transition: transform 0.06s ease, filter 0.06s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn3d:active:not(:disabled) {
      transform: translateY(2px) scale(0.98);
      filter: brightness(1.08);
      box-shadow: 0 2px 0 var(--btn-shadow);
    }
    .btn3d:disabled {
      cursor: not-allowed;
      opacity: 0.72;
    }
    .btn-green {
      background: var(--green);
      color: #0e2408;
      border-color: #9ff07a;
      box-shadow: 0 4px 0 var(--green-shadow);
    }
    .btn-green:active:not(:disabled) { box-shadow: 0 2px 0 var(--green-shadow); }
    .btn-yellow {
      background: var(--yellow);
      color: #2b1d00;
      border-color: #ffe07d;
      box-shadow: 0 4px 0 var(--yellow-shadow);
    }
    .btn-yellow:active:not(:disabled) { box-shadow: 0 2px 0 var(--yellow-shadow); }
    .btn-red {
      background: var(--red);
      color: #fff;
      border-color: #ff858e;
      box-shadow: 0 4px 0 #9e1c26;
    }

    /* AUTH & USERNAME SCREENS */
    .center-screen {
      width: 100%;
      max-width: 560px;
      height: 100dvh;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--header-bg);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .logo-title {
      font-size: 32px;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .logo-title span { color: var(--yellow); }
    .field-input {
      width: 100%;
      background: #0e193d;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .field-input:focus { border-color: var(--yellow); }
    .auth-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .auth-actions .btn3d { padding: 12px; font-size: 15px; }
    .msg-line {
      min-height: 20px;
      font-size: 13px;
      text-align: center;
      color: var(--muted);
      line-height: 1.3;
    }
    .msg-line.err { color: var(--red); }
    .msg-line.ok { color: var(--green); }

    /* PLAYER APP SHELL (STRICT 100dvh, ZERO SCROLL) */
    #player-screen {
      width: 100%;
      max-width: 560px;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      position: relative;
    }

    /* a) Header */
    .p-header {
      background: var(--header-bg);
      border-bottom: 2px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand {
      font-size: 22px;
      letter-spacing: 0.4px;
    }
    .brand span { color: var(--yellow); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .coin-pill {
      background: #0e193d;
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 4px 8px 4px 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      color: var(--yellow);
    }
    .coin-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffe680, #f0a800);
      border: 2px solid #9e6b00;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #5c3d00;
      font-size: 11px;
    }
    .bal-refresh-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: #1b2e6b;
      color: var(--muted);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .bal-refresh-btn:active {
      transform: scale(0.92);
      color: #fff;
      border-color: var(--yellow);
    }
    .bal-refresh-btn.spinning {
      animation: spin360 0.55s linear infinite;
      color: var(--yellow);
      border-color: var(--yellow);
    }
    @keyframes spin360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .menu-btn {
      width: 38px;
      height: 34px;
      font-size: 18px;
      border-radius: 12px;
    }

    /* Main play column */
    .p-body {
      flex: 1;
      min-height: 0;
      padding: 8px 12px 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    /* b) History strip */
    .history-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      flex-shrink: 0;
    }
    .hist-dot {
      width: 26px;
      height: 26px;
      max-width: 26px;
      max-height: 26px;
      border-radius: 50%;
      background: #0f1b44;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #131c3d;
      flex-shrink: 1;
    }
    .hist-dot.empty {
      color: transparent;
    }

    /* c) Status strip */
    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 25, 61, 0.65);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 6px 12px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .st-open { color: var(--green); }
    .st-draw { color: var(--muted); }
    .st-win { color: var(--yellow); }
    .pot-label { color: #fff; }

    /* d + e) Stage area (Grid + Timer OR Wheel) */
    .stage-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .num-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 7px;
      height: 100%;
      max-height: 158px;
    }
    .num-tile {
      background: var(--header-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 3px 0 #0d1638;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3px 2px;
      cursor: pointer;
      transition: transform 0.06s ease, border-color 0.1s ease, box-shadow 0.1s ease;
    }
    .num-tile:active { transform: scale(0.96); }
    .num-tile.selected {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(130, 224, 90, 0.75), 0 3px 0 #2c6617;
    }
    .tile-num {
      font-size: 20px;
      line-height: 1.05;
      color: #fff;
    }
    .tile-mult {
      font-size: 11px;
      color: var(--green);
      line-height: 1.1;
      margin-top: 1px;
    }
    .tile-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 7px;
      margin-top: 3px;
    }
    .p-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
    }
    .p-dot.mine {
      background: var(--green);
    }

    /* e) Timer Bar */
    .timer-track {
      width: 100%;
      height: 14px;
      background: #0d1638;
      border: 2px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff4d5a 0%, #ff9436 35%, #ffc933 68%, #82e05a 100%);
      transform-origin: left center;
      will-change: transform;
    }

    /* Wheel Reveal Container (fills space between status strip and bet slots) */
    .wheel-stage {
      flex: 1;
      min-height: 0;
      height: 100%;
      max-height: 260px;
      padding: 2px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .wheel-stage svg {
      height: 100%;
      max-height: 256px;
      max-width: 100%;
      width: auto;
      aspect-ratio: 1 / 1;
      overflow: visible;
    }

    /* f) Bet Panel */
    .bet-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0e193d;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 2px;
      gap: 4px;
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 5px 0;
      border-radius: 11px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--btn-bg);
      color: #fff;
    }

    .slot-box {
      background: var(--header-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 7px 8px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
      align-items: stretch;
    }
    .slot-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
    }
    .stepper-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .slot-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #0e193d;
      border: 2px solid var(--border);
      color: var(--yellow);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-btn {
      width: 30px;
      height: 28px;
      border-radius: 10px;
      font-size: 16px;
      flex-shrink: 0;
    }
    .stake-input {
      width: 100%;
      min-width: 0;
      height: 28px;
      background: #0e193d;
      border: 2px solid var(--border);
      border-radius: 10px;
      color: #fff;
      text-align: center;
      font-size: 14px;
      outline: none;
    }
    .stake-input:disabled, .step-btn:disabled, .chip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .chips-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .chip-btn {
      height: 24px;
      border-radius: 9px;
      font-size: 11px;
      padding: 0;
    }
    .slot-action-btn {
      width: 100%;
      height: 100%;
      min-height: 56px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.2;
      padding: 4px 6px;
      word-break: break-word;
    }
    .slot-action-btn.state-disabled {
      background: #1b2e6b;
      border-color: #2f499c;
      color: var(--muted);
      box-shadow: 0 3px 0 #101b42;
      opacity: 1;
    }
    .slot-action-btn.state-closed {
      background: #2b344d;
      border-color: #445073;
      color: #9ba5c2;
      box-shadow: 0 3px 0 #181e2e;
      opacity: 1;
    }

    /* g) Live Bets Bottom Bar & Sheet */
    .live-bar {
      background: var(--header-bg);
      border-top: 2px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .live-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(36px + env(safe-area-inset-bottom));
      max-height: 48dvh;
      background: #13204f;
      border-top: 2px solid var(--border);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }
    .live-sheet-list {
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(14, 25, 61, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .bet-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .bet-num-pill {
      padding: 1px 7px;
      border-radius: 8px;
      color: #131c3d;
      font-size: 12px;
      flex-shrink: 0;
    }
    .bet-uname {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bet-row-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .bet-payout { color: var(--green); }

    /* 5. PLAYER MENU DROPDOWN */
    .menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 13, 33, 0.65);
      z-index: 40;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: calc(52px + env(safe-area-inset-top)) 12px 12px;
    }
    .menu-panel {
      width: 100%;
      max-width: 340px;
      background: var(--header-bg);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .menu-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
    }
    .menu-box {
      background: #0e193d;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .menu-box-title {
      font-size: 13px;
      color: var(--muted);
    }
    .menu-input-row {
      display: flex;
      gap: 8px;
    }
    .menu-input-row .field-input {
      padding: 8px 10px;
      font-size: 14px;
    }
    .menu-input-row .btn3d {
      padding: 0 14px;
      font-size: 13px;
      flex-shrink: 0;
    }
    .box-msg {
      min-height: 16px;
      font-size: 12px;
      line-height: 1.2;
    }
    .box-msg.ok { color: var(--green); }
    .box-msg.err { color: var(--red); }

    /* Toast */
    .toast {
      position: fixed;
      top: calc(54px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      background: #101b42;
      border: 2px solid var(--yellow);
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 90;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      max-width: 90vw;
      text-align: center;
    }

    /* 7. HOST PAGE (TEAL THEME) */
    #host-screen {
      --h-bg-top: #0f3b3a;
      --h-bg-bot: #081f20;
      --h-card: #0c2e2e;
      --h-border: #1d5c5a;
      --h-accent: #4fe0c8;
      --h-muted: #8ec9c2;

      width: 100%;
      min-height: 100dvh;
      background: linear-gradient(180deg, var(--h-bg-top) 0%, var(--h-bg-bot) 100%);
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .host-container {
      width: 100%;
      max-width: 680px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .host-main-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .host-topbar {
      background: var(--h-card);
      border: 2px solid var(--h-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .host-title {
      font-size: 20px;
      color: var(--h-accent);
    }
    .host-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .host-bottom-bar {
      background: var(--h-card);
      border: 2px solid var(--h-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }
    .host-bottom-bar .h-btn {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
    }
    .h-btn {
      background: #144948;
      border: 2px solid var(--h-border);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 12px;
      box-shadow: 0 3px 0 #061819;
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .h-btn:active { transform: translateY(2px); }
    .h-btn-accent {
      background: var(--h-accent);
      color: #052120;
      border-color: #9bf5e6;
    }
    .h-btn-icon {
      min-width: 44px;
      height: 36px;
      padding: 0 12px;
      font-size: 17px;
      line-height: 1;
    }
    .red-dot {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--h-card);
    }
    .host-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .h-tile {
      background: var(--h-card);
      border: 2px solid var(--h-border);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
    }
    .h-tile-val {
      font-size: 22px;
      color: var(--h-accent);
    }
    .h-tile-lbl {
      font-size: 12px;
      color: var(--h-muted);
      margin-top: 2px;
    }
    .h-card {
      background: var(--h-card);
      border: 2px solid var(--h-border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .h-sec-title {
      font-size: 15px;
      color: var(--h-accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-bar-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    .stat-bar-head {
      display: flex;
      justify-content: space-between;
      color: #e2faf7;
    }
    .stat-bar-track {
      height: 10px;
      background: #071b1c;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--h-border);

</head>

  <script>
    // =========================================================================

    const SUPABASE_ANON_KEY = "sb_publishable__VqENgBwn--4StCbMmjfVQ_TLMpDqkn";

    // Pastel colours for numbers 1 to 10
    const TILE_COLORS = [
      "#e58f8c", "#eba975", "#e3c978", "#aed78a", "#7dcfa0",

    ];

    const EPOCH_MS = Date.parse("2026-01-01T00:00:00Z");

    };

    let roundBets = [];

    function esc(str) {

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

      toastTimer = setTimeout(() => el.classList.add("hidden"), 2800);

        $(s).classList.toggle("hidden", s !== id);
      });

    // =========================================================================
    // AUDIO (Web Audio API)
    // =========================================================================
    function ensureAudio() {
      if (!soundOn) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playClick() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.045);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    function playTick() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.035, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.025);
    }

    function playChime() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      [587.33, 880].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const t = now + idx * 0.11;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
      });
    }

    function playHostBeep() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      [660, 990].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const t = now + idx * 0.12;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      });
    }

    // =========================================================================
    // CLOCK SYNC (Lowest latency of 3 pings)
    // =========================================================================
    async function syncServerClock() {
      let bestRtt = Infinity;
      let bestOffset = 0;
      let latestTick = null;

      for (let i = 0; i < 3; i++) {
        const t0 = performance.now();
        const localStart = Date.now();
        const { data, error } = await sb.rpc("tick");
        const t1 = performance.now();
        if (!error && data && data.server_time) {
          const rtt = t1 - t0;
          const serverMs = Date.parse(data.server_time);
          const localMid = localStart + rtt / 2;
          if (rtt < bestRtt) {
            bestRtt = rtt;
            bestOffset = serverMs - localMid;
          }
          latestTick = data;
        }
      }
      clockOffsetMs = bestOffset;
      return latestTick;
    }

    function serverNowMs() {
      return Date.now() + clockOffsetMs;
    }

    function getRoundClockInfo() {
      const elapsedSec = (serverNowMs() - EPOCH_MS) / 1000;
      const roundId = Math.floor(elapsedSec / 10);
      const phaseSec = elapsedSec - roundId * 10;
      return { roundId, phaseSec, isBetting: phaseSec < 7.0 };
    }

    // =========================================================================
    // BALANCE COUNTER ANIMATION & MANUAL REFRESH
    // =========================================================================
    function setBalanceTarget(newBal, immediate = false) {
      actualBalance = Number(newBal) || 0;
      if (holdBalanceUntilWheelLands && !immediate) return;
      animateBalanceTo(actualBalance, immediate);
    }

    function animateBalanceTo(target, immediate = false) {
      cancelAnimationFrame(balanceAnimId);
      if (immediate || REDUCED_MOTION || displayedBalance === target) {
        displayedBalance = target;
        $("balance-val").textContent = String(displayedBalance);
        updateSlotButtons();
        return;
      }
      const start = displayedBalance;
      const diff = target - start;
      const startTime = performance.now();
      const dur = 350;

      function step(now) {
        const p = Math.min(1, (now - startTime) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        displayedBalance = Math.round(start + diff * eased);
        $("balance-val").textContent = String(displayedBalance);
        if (p < 1) {
          balanceAnimId = requestAnimationFrame(step);
        } else {
          displayedBalance = target;
          $("balance-val").textContent = String(target);
          updateSlotButtons();
        }
      }
      balanceAnimId = requestAnimationFrame(step);
    }

    async function manualRefreshBalance() {
      if (!currentUser || !sb) return;
      haptic(10);
      const btn = $("btn-refresh-bal");
      btn.classList.add("spinning");
      try {
        const { data, error } = await sb
          .from("wallets")
          .select("balance")
          .eq("user_id", currentUser.id)
          .single();
        if (!error && data && typeof data.balance === "number") {
          actualBalance = Number(data.balance) || 0;
          holdBalanceUntilWheelLands = false;
          animateBalanceTo(actualBalance, false);
        }
      } finally {
        setTimeout(() => btn.classList.remove("spinning"), 350);
      }
    }

    // =========================================================================
    // INIT & AUTH
    // =========================================================================
    async function initApp() {
      if (!SUPABASE_URL.startsWith("http") || SUPABASE_ANON_KEY.startsWith("REPLACE")) {
        $("loading-msg").textContent = "Setup incomplete: add SUPABASE_URL and SUPABASE_ANON_KEY in index.html.";
        return;
      }

      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      $("btn-signin").addEventListener("click", handleSignIn);
      $("btn-signup").addEventListener("click", handleSignUp);
      $("btn-save-uname").addEventListener("click", handleSaveUsername);

      const { data: { session }, error } = await sb.auth.getSession();
      if (error || !session) {
        showOnlyScreen("auth-screen");
        return;
      }
      await onAuthenticated(session.user);
    }

    async function handleSignIn() {
      haptic();
      const email = $("auth-email").value.trim();
      const password = $("auth-pass").value;
      const msg = $("auth-msg");
      msg.className = "msg-line";
      if (!email || !password) {
        msg.textContent = "Enter email and password.";
        msg.classList.add("err");
        return;
      }
      msg.textContent = "Signing in…";
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message;
        msg.classList.add("err");
        return;
      }
      if (data.user) {
        await onAuthenticated(data.user);
      }
    }

    async function handleSignUp() {
      haptic();
      const email = $("auth-email").value.trim();
      const password = $("auth-pass").value;
      const msg = $("auth-msg");
      msg.className = "msg-line";
      if (!email || !password) {
        msg.textContent = "Enter email and password.";
        msg.classList.add("err");
        return;
      }
      msg.textContent = "Creating account…";
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        msg.textContent = error.message;
        msg.classList.add("err");
        return;
      }
      if (data.session && data.user) {
        await onAuthenticated(data.user);
      } else {
        msg.textContent = "Check your email to confirm your account, then sign in.";
        msg.classList.add("ok");
      }
    }

    async function onAuthenticated(user) {
      currentUser = user;
      showOnlyScreen("loading-screen");
      $("loading-msg").textContent = "Loading profile…";

      try {
        const { data: adminFlag, error: adminErr } = await sb.rpc("is_admin");
        if (adminErr) throw adminErr;
        isHost = Boolean(adminFlag);

        if (isHost) {
          startHostApp();
          return;
        }

        const { data: bal, error: walErr } = await sb.rpc("ensure_wallet");
        if (walErr) throw walErr;
        actualBalance = Number(bal) || 0;
        displayedBalance = actualBalance;
        $("balance-val").textContent = String(displayedBalance);

        const { data: uname, error: unErr } = await sb.rpc("my_username");
        if (unErr) throw unErr;

        if (!uname) {
          showOnlyScreen("username-screen");
          return;
        }

        username = uname;
        await startPlayerApp();
      } catch (err) {
        showOnlyScreen("auth-screen");
        $("auth-msg").textContent = err.message || "Failed to load session.";
        $("auth-msg").classList.add("err");
      }
    }

    async function handleSaveUsername() {
      haptic();
      const val = $("uname-input").value.trim();
      const msg = $("uname-msg");
      msg.className = "msg-line";
      if (!val || val.length > 30) {
        msg.textContent = "Username must be 1 to 30 characters.";
        msg.classList.add("err");
        return;
      }
      msg.textContent = "Saving…";
      const { data, error } = await sb.rpc("set_username", { p_username: val });
      if (error) {
        msg.textContent = error.message;
        msg.classList.add("err");
        return;
      }
      username = data;
      await startPlayerApp();
    }

    // =========================================================================
    // PLAYER SCREEN LOGIC
    // =========================================================================
    async function startPlayerApp() {
      showOnlyScreen("player-screen");
      $("menu-signed-in").textContent = "Signed in " + username;
      $("btn-sound").textContent = soundOn ? "Sound: on" : "Sound: off";

      buildGridDOM();
      buildWheelSVG();
      wirePlayerEvents();

      const firstTick = await syncServerClock();
      if (firstTick && firstTick.round && firstTick.round.status === "SETTLED") {
        settledRoundCache[firstTick.round.id] = firstTick.round;
      }

      await fetchRecentHistory();
      setupRealtimeSubscriptions();

      requestAnimationFrame(gameLoop);

      setInterval(() => {
        const info = getRoundClockInfo();
        if (info.isBetting && activeRoundId === info.roundId) {
          fetchRoundBets(info.roundId);
        }
      }, 2500);
    }

    function buildGridDOM() {
      const grid = $("num-grid");
      grid.innerHTML = "";
      for (let n = 1; n <= 10; n++) {
        const tile = document.createElement("div");
        tile.className = "num-tile";
        tile.dataset.num = String(n);
        tile.innerHTML = `
          <div class="tile-num">${n}</div>
          <div class="tile-mult" id="mult-${n}">MAX</div>
          <div class="tile-dots" id="dots-${n}"></div>
        `;
        tile.addEventListener("click", () => {
          const info = getRoundClockInfo();
          if (!info.isBetting) return;
          haptic(10);
          selectedNumber = n;
          updateTileSelectionUI();
          updateSlotButtons();
        });
        grid.appendChild(tile);
      }
    }

    function updateTileSelectionUI() {
      document.querySelectorAll(".num-tile").forEach((el) => {
        const n = Number(el.dataset.num);
        el.classList.toggle("selected", selectedNumber === n);
      });
    }

    function buildWheelSVG() {
      const container = $("wheel-container");
      const cx = 100, cy = 100, r = 90;
      let segs = "";
      for (let i = 0; i < 10; i++) {
        const num = i + 1;
        const startDeg = -90 - 18 + i * 36;
        const endDeg = startDeg + 36;
        const midDeg = startDeg + 18;
        const rad1 = (startDeg * Math.PI) / 180;
        const rad2 = (endDeg * Math.PI) / 180;
        const midRad = (midDeg * Math.PI) / 180;

        const x1 = cx + r * Math.cos(rad1);
        const y1 = cy + r * Math.sin(rad1);
        const x2 = cx + r * Math.cos(rad2);
        const y2 = cy + r * Math.sin(rad2);

        const tx = cx + 63 * Math.cos(midRad);
        const ty = cy + 63 * Math.sin(midRad);
        const textRot = midDeg + 90;

        segs += `
          <g id="wseg-${num}" class="w-seg" style="transition:opacity 0.25s ease;">
            <path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"
                  fill="${TILE_COLORS[i]}" stroke="#101b42" stroke-width="2" />
            <text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}"
                  fill="#131c3d" font-size="15" font-weight="700"
                  text-anchor="middle" dominant-baseline="central"
                  transform="rotate(${textRot.toFixed(1)}, ${tx.toFixed(2)}, ${ty.toFixed(2)})">${num}</text>
          </g>
        `;
      }

      container.innerHTML = `
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="95" fill="#0d1638" stroke="#2a3f87" stroke-width="4" />
          <g id="wheel-rotor" transform="rotate(0, 100, 100)">
            ${segs}
            <path id="wseg-win-outline" d="" fill="none" stroke="#ffc933" stroke-width="4.5" class="hidden" />
          </g>
          <circle cx="100" cy="100" r="24" fill="#101b42" stroke="#2a3f87" stroke-width="3" />
          <text id="wheel-hub-text" x="100" y="100" fill="#ffc933" font-size="16" font-weight="700"
                text-anchor="middle" dominant-baseline="central"></text>
          <polygon points="100,16 91,2 109,2" fill="#ffc933" stroke="#101b42" stroke-width="1.5" />
        </svg>
      `;
    }

    function wirePlayerEvents() {
      $("btn-refresh-bal").addEventListener("click", manualRefreshBalance);

      $("tab-bet").addEventListener("click", () => {
        haptic();
        betMode = "bet";
        $("tab-bet").classList.add("active");
        $("tab-auto").classList.remove("active");
      });
      $("tab-auto").addEventListener("click", () => {
        haptic();
        betMode = "auto";
        $("tab-auto").classList.add("active");
        $("tab-bet").classList.remove("active");
        maybeTriggerAutoBets();
      });

      [1, 2].forEach((slot) => {
        const inp = $(`s${slot}-stake`);
        $(`s${slot}-minus`).addEventListener("click", () => {
          if (slots[slot].placed) return;
          haptic(8);
          const next = Math.max(5, (parseInt(inp.value, 10) || 10) - 10);
          inp.value = String(next);
          slots[slot].stake = next;
          updateSlotButtons();
        });
        $(`s${slot}-plus`).addEventListener("click", () => {
          if (slots[slot].placed) return;
          haptic(8);
          const next = Math.min(10000, (parseInt(inp.value, 10) || 0) + 10);
          inp.value = String(next);
          slots[slot].stake = next;
          updateSlotButtons();
        });
        inp.addEventListener("input", () => {
          slots[slot].stake = parseInt(inp.value, 10) || 0;
          updateSlotButtons();
        });
        $(`s${slot}-btn`).addEventListener("click", () => handleSlotButtonClick(slot));
      });

      document.querySelectorAll(".chip-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const slot = Number(btn.dataset.slot);
          if (slots[slot].placed) return;
          haptic(8);
          const chip = Number(btn.dataset.chip);
          const inp = $(`s${slot}-stake`);
          const next = Math.min(10000, (parseInt(inp.value, 10) || 0) + chip);
          inp.value = String(next);
          slots[slot].stake = next;
          updateSlotButtons();
        });
      });

      $("live-bar").addEventListener("click", () => {
        haptic(8);
        liveSheetOpen = !liveSheetOpen;
        $("live-sheet").classList.toggle("hidden", !liveSheetOpen);
        $("live-bar-arrow").textContent = liveSheetOpen ? "▼" : "▲";
      });

      $("btn-menu").addEventListener("click", () => {
        haptic(10);
        openPlayerMenu(false);
      });
      $("menu-backdrop").addEventListener("click", (e) => {
        if (e.target === $("menu-backdrop")) {
          $("menu-backdrop").classList.add("hidden");
        }
      });
      $("btn-signout").addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });

      $("btn-req-topup").addEventListener("click", async () => {
        haptic();
        $("msg-withdraw").textContent = "";
        const msg = $("msg-topup");
        msg.className = "box-msg";
        const amt = parseInt($("req-topup-amt").value, 10);
        if (!amt || amt < 1) {
          msg.textContent = "Empty amount.";
          msg.classList.add("err");
          return;
        }
        const { error } = await sb.rpc("request_topup", { p_amount: amt });
        if (error) {
          msg.textContent = error.message;
          msg.classList.add("err");
          return;
        }
        $("req-topup-amt").value = "";
        msg.textContent = "Request sent.";
        msg.classList.add("ok");
      });

      $("btn-req-withdraw").addEventListener("click", async () => {
        haptic();
        $("msg-topup").textContent = "";
        const msg = $("msg-withdraw");
        msg.className = "box-msg";
        const amt = parseInt($("req-withdraw-amt").value, 10);
        if (!amt) {
          msg.textContent = "Empty amount.";
          msg.classList.add("err");
          return;
        }
        if (amt < 100) {
          msg.textContent = "Minimum is 100.";
          msg.classList.add("err");
          return;
        }
        if (amt > actualBalance) {
          msg.textContent = `You only have ${actualBalance} coins.`;
          msg.classList.add("err");
          return;
        }
        const { error } = await sb.rpc("request_withdraw", { p_amount: amt });
        if (error) {
          msg.textContent = error.message;
          msg.classList.add("err");
          return;
        }
        $("req-withdraw-amt").value = "";
        msg.textContent = "Request sent.";
        msg.classList.add("ok");
      });

      $("btn-sound").addEventListener("click", () => {
        haptic(8);
        soundOn = !soundOn;
        localStorage.setItem("bwill_sound", soundOn ? "on" : "off");
        $("btn-sound").textContent = soundOn ? "Sound: on" : "Sound: off";
        if (soundOn) playClick();
      });
    }

    function openPlayerMenu(focusTopup) {
      $("msg-topup").textContent = "";
      $("msg-withdraw").textContent = "";
      $("menu-backdrop").classList.remove("hidden");
      if (focusTopup) {
        setTimeout(() => $("req-topup-amt").focus(), 50);
      }
    }

    function setSlotInputsDisabled(slot, disabled) {
      $(`s${slot}-stake`).disabled = disabled;
      $(`s${slot}-minus`).disabled = disabled;
      $(`s${slot}-plus`).disabled = disabled;
      document.querySelectorAll(`.chip-btn[data-slot="${slot}"]`).forEach((b) => {
        b.disabled = disabled;
      });
    }

    function updateSlotButtons() {
      const info = getRoundClockInfo();
      [1, 2].forEach((slot) => {
        const btn = $(`s${slot}-btn`);
        const st = slots[slot];
        const stake = parseInt($(`s${slot}-stake`).value, 10) || 0;

        btn.className = "btn3d slot-action-btn";

        if (st.placed) {
          btn.disabled = true;
          btn.classList.add("btn-yellow");
          btn.textContent = `PLACED ${st.placedStake} on #${st.placedNum}`;
          setSlotInputsDisabled(slot, true);
          return;
        }

        if (!info.isBetting) {
          btn.disabled = true;
          btn.classList.add("state-closed");
          btn.textContent = "BETTING CLOSED";
          setSlotInputsDisabled(slot, true);
          return;
        }

        setSlotInputsDisabled(slot, false);

        if (displayedBalance < 5) {
          btn.disabled = false;
          btn.classList.add("btn-green");
          btn.textContent = "REQUEST COINS";
          return;
        }

        if (!selectedNumber) {
          btn.disabled = true;
          btn.classList.add("state-disabled");
          btn.textContent = "PICK A NUMBER";
          return;
        }

        if (stake < 5 || stake > 10000) {
          btn.disabled = true;
          btn.classList.add("state-disabled");
          btn.textContent = "MIN BET 5";
          return;
        }

        if (stake > displayedBalance) {
          btn.disabled = true;
          btn.classList.add("state-disabled");
          btn.textContent = "LOW BALANCE";
          return;
        }

        btn.disabled = false;
        btn.classList.add("btn-green");
        btn.textContent = `BET ${stake} on #${selectedNumber}`;
      });
    }

    async function handleSlotButtonClick(slot) {
      const info = getRoundClockInfo();
      if (!info.isBetting || slots[slot].placed) return;

      if (displayedBalance < 5) {
        haptic(10);
        openPlayerMenu(true);
        return;
      }

      const num = selectedNumber;
      const stake = parseInt($(`s${slot}-stake`).value, 10) || 0;
      if (!num || stake < 5 || stake > 10000 || stake > displayedBalance) return;

      selectedNumber = null;
      updateTileSelectionUI();

      await submitBetForSlot(slot, num, stake, info.roundId);
    }

    async function submitBetForSlot(slot, num, stake, roundId) {
      haptic(15);
      playClick();

      const prevBal = displayedBalance;
      slots[slot].placed = true;
      slots[slot].placedNum = num;
      slots[slot].placedStake = stake;
      slots[slot].lastNum = num;
      slots[slot].optimistic = true;
      animateBalanceTo(Math.max(0, prevBal - stake), true);
      updateSlotButtons();

      const { data, error } = await sb.rpc("place_bet", {
        p_slot: slot,
        p_number: num,
        p_stake: stake
      });

      if (error) {
        slots[slot].placed = false;
        slots[slot].placedNum = null;
        slots[slot].placedStake = 0;
        slots[slot].optimistic = false;
        animateBalanceTo(prevBal, true);
        updateSlotButtons();
        showToast(error.message || "Bet rejected");
        return;
      }

      slots[slot].optimistic = false;
      if (data && typeof data.balance === "number") {
        actualBalance = data.balance;
        animateBalanceTo(data.balance, true);
      }
      await fetchRoundBets(roundId);
    }

    function maybeTriggerAutoBets() {
      if (betMode !== "auto") return;
      const info = getRoundClockInfo();
      if (!info.isBetting) return;
      if (autoTriggeredForRound === info.roundId) return;
      autoTriggeredForRound = info.roundId;

      [1, 2].forEach((slot) => {
        const st = slots[slot];
        const stake = parseInt($(`s${slot}-stake`).value, 10) || st.stake;
        if (!st.placed && st.lastNum && stake >= 5 && stake <= displayedBalance) {
          submitBetForSlot(slot, st.lastNum, stake, info.roundId);
        }
      });
    }

    // =========================================================================
    // DATA FETCHING & REALTIME
    // =========================================================================
    async function fetchRoundBets(roundId) {
      const { data, error } = await sb
        .from("bets")
        .select("*")
        .eq("round_id", roundId)
        .order("id", { ascending: true });

      if (error || !data) return;
      if (activeRoundId !== roundId) return;

      roundBets = data;

      [1, 2].forEach((slot) => {
        const mine = roundBets.find((b) => b.user_id === currentUser.id && b.slot_index === slot);
        if (mine) {
          slots[slot].placed = true;
          slots[slot].placedNum = mine.target_number;
          slots[slot].placedStake = Number(mine.stake);
          slots[slot].lastNum = mine.target_number;
          slots[slot].optimistic = false;
        }
      });

      renderBoardMetrics();
      renderLiveBetsFeed();
      updateSlotButtons();
    }

    async function fetchRecentHistory() {
      const { data, error } = await sb
        .from("rounds")
        .select("id, winning_number")
        .eq("status", "SETTLED")
        .not("winning_number", "is", null)
        .order("id", { ascending: false })
        .limit(10);

      if (!error && data) {
        historyList = data.map((r) => Number(r.winning_number));
        if (data.length > 0) {
          lastHistoryRoundId = Number(data[0].id);
        }
        renderHistoryStrip();
      }
    }

    function recordWinnerInHistory(roundId, winNum) {
      const rid = Number(roundId);
      const num = Number(winNum);
      if (!(num >= 1 && num <= 10)) return;
      if (lastHistoryRoundId !== null && rid <= lastHistoryRoundId) return;
      lastHistoryRoundId = rid;
      historyList = [num, ...historyList].slice(0, 10);
      renderHistoryStrip();
    }

    function renderHistoryStrip() {
      const strip = $("history-strip");
      strip.innerHTML = "";
      for (let i = 0; i < 10; i++) {
        const num = historyList[i];
        const div = document.createElement("div");
        if (num >= 1 && num <= 10) {
          div.className = "hist-dot";
          div.style.background = TILE_COLORS[num - 1];
          div.textContent = String(num);
        } else {
          div.className = "hist-dot empty";
          div.textContent = "0";
        }
        strip.appendChild(div);
      }
    }

    function renderBoardMetrics() {
      const pot = roundBets.reduce((acc, b) => acc + Number(b.stake), 0);
      $("pot-text").textContent = `Pot ${pot}`;

      for (let n = 1; n <= 10; n++) {
        const tileBets = roundBets.filter((b) => b.target_number === n);
        const onTile = tileBets.reduce((acc, b) => acc + Number(b.stake), 0);
        const multEl = $(`mult-${n}`);
        if (onTile <= 0 || pot <= 0) {
          multEl.textContent = "MAX";
        } else {
          const mult = (0.9 * pot) / onTile;
          multEl.textContent = mult >= 10 ? mult.toFixed(1) + "x" : mult.toFixed(2) + "x";
        }

        const dotsEl = $(`dots-${n}`);
        dotsEl.innerHTML = "";
        const seenPlayers = new Map();
        for (const b of tileBets) {
          const key = b.user_id || `bot-${b.id}`;
          if (!seenPlayers.has(key)) {
            seenPlayers.set(key, b.user_id === currentUser.id);
          }
        }
        let count = 0;
        for (const [, isMine] of seenPlayers.entries()) {
          if (count >= 5) break;
          const d = document.createElement("span");
          d.className = isMine ? "p-dot mine" : "p-dot";
          dotsEl.appendChild(d);
          count++;
        }
      }
    }

    function renderLiveBetsFeed() {
      $("live-bar-title").textContent = `Live Bets (${roundBets.length})`;
      const list = $("live-sheet-list");
      const showPayouts = wheelLanded;
      list.innerHTML = roundBets.map((b) => {
        const col = TILE_COLORS[(b.target_number || 1) - 1] || "#ccc";
        const payHtml = showPayouts && Number(b.payout) > 0
          ? `<span class="bet-payout">+${Number(b.payout)}</span>`
          : "";
        return `
          <div class="bet-row">
            <div class="bet-row-left">
              <span class="bet-num-pill" style="background:${col};">#${b.target_number}</span>
              <span class="bet-uname">${esc(b.name)}</span>
            </div>
            <div class="bet-row-right">
              <span>${Number(b.stake)}</span>
              ${payHtml}
            </div>
          </div>
        `;
      }).join("");
    }

    function setupRealtimeSubscriptions() {
      sb.channel("bwill-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "bets" }, (payload) => {
          const row = payload.new;
          if (!row || Number(row.round_id) !== activeRoundId) return;
          const idx = roundBets.findIndex((b) => b.id === row.id);
          if (idx >= 0) roundBets[idx] = row;
          else roundBets.push(row);

          if (row.user_id === currentUser.id && (row.slot_index === 1 || row.slot_index === 2)) {
            slots[row.slot_index].placed = true;
            slots[row.slot_index].placedNum = row.target_number;
            slots[row.slot_index].placedStake = Number(row.stake);
            slots[row.slot_index].lastNum = row.target_number;
          }
          renderBoardMetrics();
          renderLiveBetsFeed();
          updateSlotButtons();
        })
        .on("postgres_changes", { event: "*", schema: "public", table: "rounds" }, (payload) => {
          const r = payload.new;
          if (r && r.status === "SETTLED") {
            settledRoundCache[r.id] = r;
          }
        })
        .on("postgres_changes", {
          event: "UPDATE",
          schema: "public",
          table: "wallets",
          filter: `user_id=eq.${currentUser.id}`
        }, (payload) => {
          if (payload.new && typeof payload.new.balance === "number") {
            setBalanceTarget(payload.new.balance, false);
          }
        })
        .subscribe();
    }

    // =========================================================================
    // MAIN ROUND LOOP & WHEEL REVEAL
    // =========================================================================
    function onEnterBettingRound(roundId) {
      activeRoundId = roundId;
      clearInterval(tickRetryTimer);
      wheelLanded = false;
      wheelTargetWinner = null;
      wheelDecelStart = null;
      holdBalanceUntilWheelLands = false;

      animateBalanceTo(actualBalance, true);

      [1, 2].forEach((slot) => {
        slots[slot].placed = false;
        slots[slot].placedNum = null;
        slots[slot].placedStake = 0;
        slots[slot].optimistic = false;
      });
      roundBets = [];

      $("grid-container").classList.remove("hidden");
      $("wheel-container").classList.add("hidden");
      $("status-text").className = "st-open";
      $("status-text").textContent = "OPEN";

      renderBoardMetrics();
      renderLiveBetsFeed();
      updateSlotButtons();

      sb.rpc("tick").then(({ data }) => {
        if (data && data.round && data.round.status === "SETTLED") {
          settledRoundCache[data.round.id] = data.round;
        }
        fetchRoundBets(roundId);
      });

      setTimeout(maybeTriggerAutoBets, 120);
    }

    function onEnterRevealPhase(roundId) {
      activeRoundId = roundId;
      selectedNumber = null;
      updateTileSelectionUI();
      updateSlotButtons();

      holdBalanceUntilWheelLands = true;
      wheelLanded = false;
      wheelTargetWinner = null;
      wheelDecelStart = null;
      lastTickSegment = -1;

      const winOutline = $("wseg-win-outline");
      if (winOutline) winOutline.classList.add("hidden");
      const hubText = $("wheel-hub-text");
      if (hubText) hubText.textContent = "";
      for (let i = 1; i <= 10; i++) {
        const seg = $(`wseg-${i}`);
        if (seg) seg.style.opacity = "1";
      }

      $("grid-container").classList.add("hidden");
      $("wheel-container").classList.remove("hidden");
      $("status-text").className = "st-draw";
      $("status-text").textContent = "DRAWING…";

      clearInterval(tickRetryTimer);
      const pollSettle = async () => {
        if (settledRoundCache[roundId]) {
          clearInterval(tickRetryTimer);
          return;
        }
        const { data } = await sb.rpc("tick");
        if (data && data.round && data.round.status === "SETTLED") {
          settledRoundCache[data.round.id] = data.round;
          clearInterval(tickRetryTimer);
        }
      };
      pollSettle();
      tickRetryTimer = setInterval(pollSettle, 350);
    }

    function startWheelDeceleration(winningNumber, phaseSec) {
      wheelTargetWinner = winningNumber;
      wheelDecelStart = performance.now();
      wheelDecelFrom = ((wheelAngle % 360) + 360) % 360;

      const targetMod = (360 - (winningNumber - 1) * 36) % 360;
      let delta = (targetMod - wheelDecelFrom + 360) % 360;
      wheelDecelTo = wheelDecelFrom + 720 + delta;

      const remainingMs = Math.max(600, (9.65 - phaseSec) * 1000);
      wheelDecelDuration = Math.min(1800, Math.max(1200, remainingMs));
      if (remainingMs < 1200) {
        wheelDecelDuration = remainingMs;
      }
    }

    function onWheelLanding(roundRow) {
      if (wheelLanded) return;
      wheelLanded = true;
      const winNum = Number(roundRow.winning_number);

      playChime();
      haptic(25);

      for (let i = 1; i <= 10; i++) {
        const seg = $(`wseg-${i}`);
        if (seg) seg.style.opacity = i === winNum ? "1" : "0.32";
      }

      const cx = 100, cy = 100, r = 90;
      const startDeg = -90 - 18 + (winNum - 1) * 36;
      const endDeg = startDeg + 36;
      const rad1 = (startDeg * Math.PI) / 180;
      const rad2 = (endDeg * Math.PI) / 180;
      const x1 = cx + r * Math.cos(rad1);
      const y1 = cy + r * Math.sin(rad1);
      const x2 = cx + r * Math.cos(rad2);
      const y2 = cy + r * Math.sin(rad2);

      const outline = $("wseg-win-outline");
      if (outline) {
        outline.setAttribute("d", `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`);
        outline.classList.remove("hidden");
      }

      const hub = $("wheel-hub-text");
      if (hub) hub.textContent = String(winNum);

      $("status-text").className = "st-win";
      $("status-text").textContent = `WINNER: #${winNum}`;

      recordWinnerInHistory(roundRow.id, winNum);

      holdBalanceUntilWheelLands = false;
      sb.from("wallets").select("balance").eq("user_id", currentUser.id).single().then(({ data }) => {
        if (data && typeof data.balance === "number") {
          setBalanceTarget(data.balance, false);
        } else {
          animateBalanceTo(actualBalance, false);
        }
      });
      fetchRoundBets(roundRow.id);
    }

    let lastFrameTs = performance.now();
    function gameLoop(nowTs) {
      const dt = Math.min(0.1, (nowTs - lastFrameTs) / 1000);
      lastFrameTs = nowTs;

      const info = getRoundClockInfo();
      const phase = info.isBetting ? "BETTING" : "REVEAL";

      if (activeRoundId !== info.roundId || lastPhase !== phase) {
        lastPhase = phase;
        if (info.isBetting) {
          onEnterBettingRound(info.roundId);
        } else {
          onEnterRevealPhase(info.roundId);
        }
      }

      if (info.isBetting) {
        const ratio = Math.max(0, Math.min(1, (7.0 - info.phaseSec) / 7.0));
        $("timer-fill").style.transform = `scaleX(${ratio.toFixed(4)})`;
      } else {
        const settled = settledRoundCache[info.roundId];
        if (settled && settled.winning_number && wheelTargetWinner === null) {
          startWheelDeceleration(Number(settled.winning_number), info.phaseSec);
        }

        const rotor = $("wheel-rotor");
        if (rotor) {
          if (wheelTargetWinner === null) {
            wheelAngle = (wheelAngle + 720 * dt) % 360;
            rotor.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)}, 100, 100)`);
          } else if (!wheelLanded) {
            const elapsed = nowTs - wheelDecelStart;
            const p = Math.min(1, elapsed / wheelDecelDuration);
            const eased = REDUCED_MOTION ? 1 : 1 - Math.pow(1 - p, 3);
            wheelAngle = wheelDecelFrom + (wheelDecelTo - wheelDecelFrom) * eased;
            rotor.setAttribute("transform", `rotate(${wheelAngle.toFixed(2)}, 100, 100)`);

            const segIdx = Math.floor((((360 - (wheelAngle % 360)) % 360) + 18) / 36) % 10;
            if (segIdx !== lastTickSegment) {
              lastTickSegment = segIdx;
              playTick();
            }

            if (p >= 1) {
              onWheelLanding(settled);
            }
          }
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // =========================================================================
    // 7. HOST PAGE LOGIC
    // =========================================================================
    function setHostView(view) {
      hostActiveView = view;
      const isReqView = view === "requests";
      $("host-dashboard-view").classList.toggle("hidden", isReqView);
      $("host-requests-view").classList.toggle("hidden", !isReqView);
      $("h-btn-req-view").classList.toggle("hidden", isReqView);
      $("h-btn-back-dash").classList.toggle("hidden", !isReqView);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleCollapsible(key) {
      haptic(8);
      collapsibleState[key] = !collapsibleState[key];
      applyCollapsibleUI();
    }

    function applyCollapsibleUI() {
      ["topup", "withdraw", "decisions"].forEach((key) => {
        const open = collapsibleState[key];
        $(`toggle-${key}`).setAttribute("aria-expanded", String(open));
        $(`h-${key}-body`).classList.toggle("hidden", !open);
        $(`chev-${key}`).classList.toggle("collapsed", !open);
      });
    }

    async function startHostApp() {
      showOnlyScreen("host-screen");
      setHostView("dashboard");
      applyCollapsibleUI();

      $("h-btn-signout").addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });

      $("h-btn-copy").addEventListener("click", async () => {
        haptic();
        try {
          await navigator.clipboard.writeText(window.location.origin + window.location.pathname);
          showToast("Game link copied!");
        } catch (_) {
          showToast(window.location.origin + window.location.pathname);
        }
      });

      $("h-btn-req-view").addEventListener("click", () => {
        haptic();
        setHostView("requests");
        refreshHostDashboard(false);
      });

      $("h-btn-back-dash").addEventListener("click", () => {
        haptic();
        setHostView("dashboard");
        refreshHostDashboard(false);
      });

      $("toggle-topup").addEventListener("click", () => toggleCollapsible("topup"));
      $("toggle-withdraw").addEventListener("click", () => toggleCollapsible("withdraw"));
      $("toggle-decisions").addEventListener("click", () => toggleCollapsible("decisions"));

      $("h-bars").innerHTML = `<div style="font-size:12px;color:var(--h-muted);">Loading…</div>`;
      ["h-topup-list", "h-withdraw-list", "h-decisions-list"].forEach((id) => {
        $(id).innerHTML = `<div style="font-size:12px;color:var(--h-muted);">Loading…</div>`;
      });
      if (!$("h-status")) {
        document.querySelector(".host-topbar").insertAdjacentHTML(
          "afterend",
          `<div id="h-status" style="font-size:11px;color:var(--h-muted);padding:0 8px;">Starting…</div>`
        );
      }

      await refreshHostDashboard(true);

      sb.channel("bwill-host")
        .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, () => {
          refreshHostDashboard(false);
        })
        .subscribe((status) => {
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
            console.warn("[host] Realtime on public.requests:", status, "- falling back to 8s polling");
          }
        });

      hostPollTimer = setInterval(() => refreshHostDashboard(false), 8000);
    }

    // ---- Host loading helpers (shape-tolerant + error-aware) ----
    let hostRefreshing = false;
    let hostRefreshQueued = false;
    let hostLastErrKey = "";
    const hostLoaded = { stats: false, reqs: false };

    // Run a Supabase call; never throws, always returns { data, error }
    async function hostSafe(promiseLike) {
      try {
        const r = await Promise.race([
          promiseLike,
          new Promise((_, rej) => setTimeout(() => rej(new Error("Request timed out (12s)")), 12000))
        ]);
        return { data: r ? r.data : null, error: r ? r.error : null };
      } catch (e) {
        return { data: null, error: e };
      }
    }

    // RPCs can return a row, an array of rows, or a single-key wrapper object
    function hostRow(d, wrapKey) {
      if (Array.isArray(d)) d = d[0] ?? null;
      if (d && wrapKey && d[wrapKey] && typeof d[wrapKey] === "object" && !Array.isArray(d[wrapKey])) d = d[wrapKey];
      return d && typeof d === "object" ? d : null;
    }
    function hostRows(d, wrapKey) {
      if (Array.isArray(d)) return d;
      if (d && wrapKey && Array.isArray(d[wrapKey])) return d[wrapKey];
      return [];
    }
    function hostErrHtml(msg) {
      return `<div style="font-size:12px;color:#ff9a9a;">${esc(msg)}</div>`;
    }

    async function refreshHostDashboard(isInitial) {
      // Prevent overlapping refreshes (Realtime + 8s poll + button clicks)
      if (hostRefreshing) { hostRefreshQueued = true; return; }
      hostRefreshing = true;
      try {
        const [rStats, rReqs, rPlayers, rDone] = await Promise.all([
          hostSafe(sb.rpc("stats")),
          hostSafe(sb.from("requests").select("*").eq("status", "PENDING").order("created_at", { ascending: true })),
          hostSafe(sb.rpc("players")),
          hostSafe(sb.from("requests").select("*").in("status", ["APPROVED", "DECLINED"]).order("decided_at", { ascending: false }).limit(15))
        ]);

        // Log every failure with its source so it's visible in DevTools
        const errs = [];
        if (rStats.error)   errs.push(["stats()", rStats.error]);
        if (rReqs.error)    errs.push(["requests", rReqs.error]);
        if (rPlayers.error) errs.push(["players()", rPlayers.error]);
        errs.forEach(([src, e]) => console.error(`[host] ${src} failed:`, e));
        const errKey = errs.map(([src, e]) => src + ":" + (e.message || e)).join("|");
        if (errKey && errKey !== hostLastErrKey) {
          showToast(`Host data error: ${errs[0][0]} – ${errs[0][1].message || errs[0][1]}`);
        }
        hostLastErrKey = errKey;

        const playerMap = new Map();
        hostRows(rPlayers.data, "players").forEach((p) => playerMap.set(p.user_id, p));

        const reqsOk = !rReqs.error;
        const pending = reqsOk ? hostRows(rReqs.data) : [];
        const st = rStats.error ? null : hostRow(rStats.data, "stats");

        if (!rStats.error && !st) console.warn("[host] stats() returned no usable row:", rStats.data);
        if (reqsOk && !pending.length) console.info("[host] requests query OK but returned 0 PENDING rows (if you expect rows, check RLS SELECT policy)");

        // ---- Stats ----
        if (st) {
          hostLoaded.stats = true;
          const pendingCount = reqsOk
            ? pending.length
            : (typeof st.pending_requests === "number" ? st.pending_requests : 0);

          $("h-sum-profit").textContent = String(st.house_profit ?? 0);
          $("h-sum-players").textContent = String(st.total_players ?? 0);
          $("h-sum-pending").textContent = String(pendingCount);
          $("h-req-dot").classList.toggle("hidden", pendingCount === 0);

          const pot = Number(st.total_pot) || 0;
          const profit = Number(st.house_profit) || 0;
          const paid = Number(st.total_paid) || 0;
          const settledCnt = Number(st.settled_rounds) || 0;
          const deadCnt = Number(st.dead_rounds) || 0;
          const totPl = Number(st.total_players) || 0;
          const actPl = Number(st.active_players) || 0;

          const housePct = pot > 0 ? Math.round((profit / pot) * 100) : 0;
          const paidPct = pot > 0 ? Math.round((paid / pot) * 100) : 0;
          const deadPct = settledCnt > 0 ? Math.round((deadCnt / settledCnt) * 100) : 0;
          const actPct = totPl > 0 ? Math.round((actPl / totPl) * 100) : 0;

          const bars = [
            { label: "House profit today", val: `${profit} coins`, pct: pot > 0 ? Math.min(100, housePct * 2) : 0 },
            { label: "House share of pot", val: `${housePct}%`, pct: housePct },
            { label: "Paid out to players", val: `${paidPct}% (${paid})`, pct: paidPct },
            { label: "Dead rounds", val: `${deadCnt} (${deadPct}%)`, pct: deadPct },
            { label: "Players active today", val: `${actPl} of ${totPl}`, pct: actPct },
            { label: "Total bet today", val: `${pot} coins`, pct: pot > 0 ? 100 : 0 },
            { label: "Top-ups approved", val: `${st.topups_approved ?? 0} coins`, pct: (st.topups_approved ?? 0) > 0 ? 100 : 0 },
            { label: "Total withdrawn", val: `${st.total_withdrawn ?? 0} coins`, pct: (st.total_withdrawn ?? 0) > 0 ? 100 : 0 }
          ];

          $("h-bars").innerHTML = bars.map((b) => `
            <div class="stat-bar-row" style="margin-bottom:8px;">
              <div class="stat-bar-head"><span>${b.label}</span><span>${b.val}</span></div>
              <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${b.pct}%;"></div></div>
            </div>
          `).join("");
        } else if (!hostLoaded.stats) {
          // Only show an inline error if we've never had good data (don't wipe last-good numbers)
          $("h-bars").innerHTML = hostErrHtml(
            rStats.error
              ? `Couldn't load stats: ${rStats.error.message || rStats.error}`
              : "Stats returned no data."
          );
        }

        // Keep the pending tile/dot right even if stats() failed
        if (!st && reqsOk) {
          $("h-sum-pending").textContent = String(pending.length);
          $("h-req-dot").classList.toggle("hidden", pending.length === 0);
        }

        // ---- New-request beep ----
        if (reqsOk) {
          let hasNew = false;
          pending.forEach((r) => {
            if (!knownPendingIds.has(r.id)) {
              if (!isInitial) hasNew = true;
              knownPendingIds.add(r.id);
            }
          });
          if (hasNew) {
            playHostBeep();
            showToast("New player request received!");
          }
        }

        // ---- Request lists ----
        if (reqsOk) {
          hostLoaded.reqs = true;
          renderRequestGroup("h-topup-list", "h-topup-count", pending.filter((r) => r.kind === "TOPUP"), playerMap);
          renderRequestGroup("h-withdraw-list", "h-withdraw-count", pending.filter((r) => r.kind === "WITHDRAW"), playerMap);
        } else if (!hostLoaded.reqs) {
          const msg = `Couldn't load requests: ${rReqs.error.message || rReqs.error}`;
          $("h-topup-list").innerHTML = hostErrHtml(msg);
          $("h-withdraw-list").innerHTML = hostErrHtml(msg);
        }

        // ---- Recent decisions: prefer server history, fall back to local session list ----
        if (!rDone.error && Array.isArray(rDone.data)) {
          recentDecisions = rDone.data.map((r) => {
            const pInfo = playerMap.get(r.user_id);
            return {
              id: String(r.id),
              name: r.name || (pInfo && (pInfo.username || pInfo.name)) || "Player",
              kind: r.kind,
              amount: Number(r.amount),
              approved: r.status === "APPROVED",
              decidedAt: new Date(r.decided_at || r.created_at)
                .toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
            };
          });
        } else if (rDone.error) {
          console.warn("[host] decided-requests query failed (using local list):", rDone.error);
        }
        renderRecentDecisions();
        const stEl = $("h-status");
        if (stEl) {
          const t = new Date().toLocaleTimeString();
          stEl.style.color = errs.length ? "#ff9a9a" : "var(--h-muted)";
          stEl.textContent = errs.length
            ? `Error – ${errs.map(([src, e]) => src + ": " + (e.message || e)).join(" | ")}`
            : `Updated ${t} · ${pending.length} pending`;
        }
      } catch (err) {
        console.error("[host] refresh failed:", err);
        if ($("h-status")) { $("h-status").style.color = "#ff9a9a"; $("h-status").textContent = "Error – " + (err.message || err); }
        showToast("Host refresh failed: " + (err.message || err));
      } finally {
        hostRefreshing = false;
        if (hostRefreshQueued) {
          hostRefreshQueued = false;
          refreshHostDashboard(false);
        }
      }
    }

    function renderRequestGroup(containerId, countId, items, playerMap) {
      const el = $(containerId);
      const countEl = $(countId);
      countEl.textContent = String(items.length);
      countEl.classList.toggle("has-items", items.length > 0);

      if (!items.length) {
        el.innerHTML = `<div style="font-size:12px;color:var(--h-muted);">None pending.</div>`;
        return;
      }
      el.innerHTML = items.map((r) => {
        const pInfo = playerMap.get(r.user_id);
        const curBal = pInfo ? Number(pInfo.balance) : 0;
        const pName = r.name || (pInfo && (pInfo.username || pInfo.name)) || "Player";
        const timeStr = new Date(r.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const payload = encodeURIComponent(JSON.stringify({
          id: r.id,
          name: pName,
          kind: r.kind,
          amount: Number(r.amount)
        }));
        return `
          <div class="req-card">
            <div class="req-main-row">
              <div class="req-info">
                <div class="req-player-line">${esc(pName)} · <span style="color:var(--h-accent);">${Number(r.amount)} coins</span></div>
                <div class="req-meta-line">Bal: ${curBal} · ${timeStr}</div>
              </div>
              <div class="req-btns">
                <button class="h-btn h-btn-accent h-btn-icon" type="button" aria-label="Approve" title="Approve" onclick="hostDecideReq(${r.id}, true, '${payload}')">✓</button>
                <button class="h-btn h-btn-icon" style="background:#6b1d24;border-color:#a8323c;" type="button" aria-label="Disapprove" title="Disapprove" onclick="hostDecideReq(${r.id}, false, '${payload}')">✕</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRecentDecisions() {
      const el = $("h-decisions-list");
      const countEl = $("h-decisions-count");
      countEl.textContent = String(recentDecisions.length);
      countEl.classList.remove("has-items");

      if (!recentDecisions.length) {
        el.innerHTML = `<div style="font-size:12px;color:var(--h-muted);">No recent decisions yet.</div>`;
        return;
      }

      el.innerHTML = recentDecisions.map((d) => {
        const signClass = d.approved ? "approved" : "disapproved";
        const signLabel = d.approved ? "✓ Approved" : "✕ Disapproved";
        const kindLabel = d.kind === "WITHDRAW" ? "Withdraw" : "Top-up";
        return `
          <div class="req-card">
            <div class="req-main-row">
              <div class="req-info">
                <div class="req-player-line">${esc(d.name)} · <span style="color:var(--h-accent);">${d.amount} coins</span></div>
                <div class="req-meta-line">${kindLabel} · ${d.decidedAt}</div>
              </div>
              <span class="decision-sign ${signClass}">${signLabel}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    window.hostDecideReq = async function(reqId, ok, encodedMeta) {
      haptic();
      const { error } = await sb.rpc("decide", { p_request_id: reqId, p_ok: ok });
      if (error) {
        showToast(error.message);
        return;
      }

      let meta = { id: reqId, name: "Player", kind: "TOPUP", amount: 0 };
      if (encodedMeta) {
        try {
          meta = JSON.parse(decodeURIComponent(encodedMeta));
        } catch (_) {}
      }

      recentDecisions = [
        {
          id: `${reqId}-${Date.now()}`,
          name: meta.name,
          kind: meta.kind,
          amount: meta.amount,
          approved: Boolean(ok),
          decidedAt: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
        },
        ...recentDecisions
      ].slice(0, 15);

      showToast(ok ? "✓ Approved" : "✕ Disapproved");
      await refreshHostDashboard(false);
    };

    window.addEventListener("DOMContentLoaded", initApp);

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
